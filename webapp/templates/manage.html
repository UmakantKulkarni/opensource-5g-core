<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Deployments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #fff;
        }
    </style>
</head>
<body>
<div class="container" style="max-width: 500px;">
    <div class="card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="m-0">Manage Deployments</h1>
            <a href="/" class="btn btn-link">Home</a>
        </div>
        <div class="mb-3">
            <label for="namespace" class="form-label">Namespace</label>
            <input type="text" id="namespace" class="form-control" value="ztx5gc">
        </div>
        <div class="mb-3">
            <label for="release" class="form-label">Release Name</label>
            <input type="text" id="release" class="form-control" value="5gcore">
        </div>
        <div class="d-grid gap-2">
            <button class="btn btn-primary" onclick="update()">Update Deployment</button>
            <button class="btn btn-danger" onclick="remove()">Delete Deployment</button>
        </div>
    </div>
</div>
<script>
function update(){
    const ns = document.getElementById('namespace').value;
    const rel = document.getElementById('release').value;
    fetch(`/release_exists?namespace=${encodeURIComponent(ns)}&release=${encodeURIComponent(rel)}`)
        .then(r => r.json())
        .then(d => {
            if (d.exists) {
                window.location = `/create?namespace=${encodeURIComponent(ns)}&release=${encodeURIComponent(rel)}&mode=update`;
            } else if (confirm('Release does not exist. Create it?')) {
                window.location = `/create?namespace=${encodeURIComponent(ns)}&release=${encodeURIComponent(rel)}`;
            } else {
                window.location = '/';
            }
        });
}
function remove(){
    const ns=document.getElementById('namespace').value;
    const rel=document.getElementById('release').value;
    fetch('/delete',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({helmNamespace:ns,helmReleaseName:rel})
    }).then(r=>r.json()).then(d=>alert(d.output));
}
</script>
</body>
</html>
