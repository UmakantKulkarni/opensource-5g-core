{{- if .Values.monitoring.logviewer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logviewer
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-dashboard-csrf
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  csrf: {{ randAlphaNum 32 | b64enc | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logviewer
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: logviewer
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logviewer
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logviewer
  template:
    metadata:
      labels:
        app: logviewer
    spec:
      serviceAccountName: logviewer
      containers:
        - name: logviewer
          image: "{{ .Values.monitoring.logviewer.image.repository }}:{{ .Values.monitoring.logviewer.image.tag }}"
          ports:
            - containerPort: 9090
          args:
            - '--enable-skip-login'
            - '--disable-settings-authorizer'
            - '--enable-insecure-login'
            - '--namespace={{ .Release.Namespace }}'
            - '--insecure-bind-address=0.0.0.0'
            - '--insecure-port=9090'
---
apiVersion: v1
kind: Service
metadata:
  name: logviewer
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: logviewer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9090
      nodePort: {{ .Values.monitoring.logviewer.nodeport | default 30070 }}
{{- end }}
